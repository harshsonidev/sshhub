<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151c26"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc0ff"/>
      <stop offset="1" stop-color="#3d8ef5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#4d9fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4d9fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <rect x="10" y="10" width="1004" height="1004" rx="222" fill="none"
        stroke="#3a4656" stroke-opacity="0.55" stroke-width="8"/>

  <!-- key rotated onto the diagonal: hub-head top-left, shaft to bottom-right -->
  <g transform="translate(512 512) rotate(45)">
    <!-- hub ring = key head -->
    <circle cx="0" cy="-170" r="128" fill="none" stroke="url(#key)" stroke-width="58"/>
    <!-- shaft -->
    <rect x="-29" y="-52" width="58" height="378" rx="29" fill="url(#key)"/>
    <!-- teeth -->
    <rect x="0" y="196" width="104" height="56" rx="28" fill="url(#key)"/>
    <rect x="0" y="276" width="76" height="50" rx="25" fill="url(#key)"/>
    <!-- identity nodes on the ring -->
    <g transform="translate(0 -170)">
      <circle cx="-110.8" cy="64" r="46" fill="#3fb950" stroke="#0b0e13" stroke-width="18"/>
      <circle cx="110.8" cy="64" r="46" fill="#d29922" stroke="#0b0e13" stroke-width="18"/>
      <circle cx="0" cy="-128" r="46" fill="#e6ebf2" stroke="#0b0e13" stroke-width="18"/>
    </g>
  </g>
</svg>
